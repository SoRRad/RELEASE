steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/release-01-492902/release-chatbot/app:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/release-01-492902/release-chatbot/app:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-sha'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/release-01-492902/release-chatbot/app:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/release-01-492902/release-chatbot/app:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'release-chatbot'
      - '--image=us-central1-docker.pkg.dev/release-01-492902/release-chatbot/app:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=GOOGLE_PROJECT_ID=release-01-492902,GOOGLE_LOCATION=us-central1,GEMINI_MODEL=gemini-2.5-flash'
      - '--set-secrets=ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,ADMIN_PASSWORD=ADMIN_PASSWORD:latest,GITHUB_TOKEN=GITHUB_TOKEN:latest'

images:
  - 'us-central1-docker.pkg.dev/release-01-492902/release-chatbot/app:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/release-01-492902/release-chatbot/app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_STANDARD_2'
